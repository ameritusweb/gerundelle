[package]
name = "chess_board"
version = "0.1.0"
edition = "2021"

[lib]
name = "chess_board"
crate-type = ["cdylib", "rlib"]

[features]
# python: the pyo3 extension (maturin, the native build; on by default, as before). wasm: wasm-bindgen bindings for the browser
# (site/chess: wasm-pack build --target web --no-default-features --features wasm), the same core behind both.
default = ["python"]
python = ["dep:pyo3"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[profile.release]
opt-level = 3
lto = true
