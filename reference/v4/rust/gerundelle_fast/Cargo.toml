[package]
name = "gerundelle_fast"
version = "0.1.0"
edition = "2021"
description = "Settled kernels of Gerundelle in Rust (molecules.py calls them; each gives exactly what the Python it replaces gives)"

[lib]
name = "gerundelle_fast"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }

[profile.release]
opt-level = 3
lto = true
